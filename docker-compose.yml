# Template Travel Company
#
#   docker compose up          → application + base de démonstration sur http://localhost:8000
#   docker compose up mysql    → MySQL seul (port 3307), pour développer avec PHP installé sur la machine
#   docker compose down -v     → tout arrêter et effacer la base
#
# DEMO_RESET=true docker compose up  recrée les données de démonstration à chaque démarrage.
services:
  app:
    build: .
    container_name: travel_company_app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_URL: http://localhost:${APP_PORT:-8000}
      APP_PORT: ${APP_PORT:-8000}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DEMO_DATABASE:-travel_company}
      DB_USERNAME: root
      DB_PASSWORD: secret
      CACHE_DRIVER: file
      MAIL_MAILER: log
      LOG_STACK: daily
      DEMO_RESET: ${DEMO_RESET:-false}
    ports:
      - "${APP_PORT:-8000}:8000"

  mysql:
    image: mysql:8.4
    container_name: travel_company_mysql
    restart: "no"
    environment:
      MYSQL_DATABASE: travel_company
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      retries: 20

volumes:
  mysql_data:
